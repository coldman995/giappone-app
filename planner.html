<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J26 · Planner</title><style>:root{--ink:#18211d;--red:#bd1f36;--paper:#fffaf1;--line:#e7dbce;--accent:#fff0bf}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:16px system-ui;color:var(--ink)}header{padding:22px max(18px,calc((100% - 980px)/2));background:linear-gradient(120deg,#fff8ed,#f7dbd1)}h1{margin:0;font-size:2.3rem;letter-spacing:-.06em}.flag{display:inline-block;width:30px;height:20px;background:#fff;border-radius:3px;vertical-align:middle;position:relative}.flag:after{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:var(--red);top:5px;left:10px}header a{color:var(--red);font-weight:750;text-decoration:none}main{max-width:980px;margin:auto;padding:18px}.cities{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.cities button,.controls button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;font:inherit;white-space:nowrap;cursor:pointer}.cities button.active,.controls .primary{background:var(--ink);color:#fff;border-color:var(--ink)}.day{margin:18px 0 34px}.day h2{margin:0;font-size:1.45rem}.sub{color:#746b62;margin:5px 0 13px}.flagged{border-left:4px solid #dc9400;background:var(--accent);padding:12px 14px;border-radius:8px;margin:12px 0;line-height:1.4}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.stop{position:relative;display:grid;grid-template-columns:82px 1fr auto;gap:10px;align-items:start;background:#fff;border:1px solid var(--line);border-bottom:0;padding:13px}.stop:first-of-type{border-radius:13px 13px 0 0}.stop:last-child{border-bottom:1px solid var(--line);border-radius:0 0 13px 13px}.stop.drag{opacity:.4}.time{font-size:.82rem;color:var(--red);font-weight:800}.stop h3{font-size:1rem;margin:0 0 4px}.stop p{margin:0;color:#5c655e;font-size:.9rem}.actions{display:flex;gap:5px}.actions button{border:0;background:#f5eee7;border-radius:7px;padding:7px;cursor:pointer}.note{width:100%;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:.85rem}.hidden{display:none}@media(max-width:600px){header{padding:19px 16px}main{padding:14px}.day h2{font-size:1.28rem}.stop{grid-template-columns:66px 1fr}.actions{grid-column:2}.stop h3{font-size:.96rem}.controls button{min-height:42px}.note{font-size:16px}}</style><header><a href="index.html">← J26</a><h1>Planner <span class="flag"></span></h1></header><main><nav class="cities" id="cities"></nav><div id="days"></div></main><script src="planner-sync.js"></script><script>
const plans={Tokyo:[{d:'17 ott',title:'Arrivo, Asakusa e serata',flag:'Ameyoko chiude presto: è meglio visitarla prima. Non tornare ad Akihabara dopo Senso-ji; per la notte scegli Shinjuku.',original:['Narita Airport','Tokyo Station','Appartamento','Akihabara + Kanda Shrine','Ameyoko + Ueno Park','Tokyo Skytree + Sumida','Asakusa','Senso-ji','Akihabara / Asakusa / Shinjuku','Appartamento'],auto:['Narita Airport','Tokyo Station','Appartamento','Akihabara + Kanda Shrine','Ameyoko + Ueno Park','Asakusa','Senso-ji','Shinjuku','Appartamento']},{d:'18 ott',title:'Meiji, Harajuku e Shibuya',flag:'Percorso già coerente. Don Quijote resta una deviazione facoltativa dopo la serata.',original:['Meiji Jingu','Shinjuku Gyoen','Takeshita Street','Shibuya Parco','Hachiko','Shibuya Crossing','Shibuya Sky','Cena a Shibuya','Nonbei Yokocho','MEGA Don Quijote / Appartamento'],auto:['Meiji Jingu','Shinjuku Gyoen','Takeshita Street','Shibuya Parco','Hachiko + Crossing','Shibuya Sky','Cena a Shibuya','Nonbei Yokocho','Appartamento']},{d:'19 ott',title:'Imperial Palace e Shinjuku',flag:'Attenzione: Nakamise Street è ad Asakusa, distante da Yasukuni e Shinjuku. Mettila in una giornata Asakusa oppure sostituiscila con un pranzo nel centro.',original:['Palazzo Imperiale','Santuario Yasukuni','Nakamise Street','Omoide Yokocho','Kabukicho Tower','Kabuki Hall Yokocho','Sala giochi','Golden Gai','Karaoke / Appartamento'],auto:['Palazzo Imperiale','Santuario Yasukuni','Pranzo nel centro','Omoide Yokocho','Kabukicho Tower','Kabuki Hall Yokocho','Sala giochi','Golden Gai','Karaoke / Appartamento']},{d:'20 ott',title:'Baia, Odaiba e Roppongi',flag:'Ordine coerente per zone. Prenota TeamLab e crociera.',original:['TeamLab Planets','Tsukiji Outer Market','Hamarikyu Gardens','Odaiba','Crociera baia','Rainbow Bridge','Yurakucho Yokocho','Roppongi','Appartamento'],auto:['TeamLab Planets','Tsukiji Outer Market','Hamarikyu Gardens','Crociera baia','Odaiba + Rainbow Bridge','Yurakucho Yokocho','Roppongi','Appartamento']},{d:'21 ott',title:'Tokyo Tower',flag:'Scegli una sola attività: kart oppure tour JDM. Non sono compatibili negli orari.',original:['TeamLab Borderless','Zojo-ji','Pranzo','Tokyo Tower','RED° Tokyo Tower','Kart / Tour JDM','Shimbashi','Appartamento'],auto:['TeamLab Borderless','Zojo-ji','Pranzo','Tokyo Tower','RED° Tokyo Tower','Kart oppure Tour JDM','Shimbashi','Appartamento']}],Kawaguchiko:[{d:'22 ott',title:'Fuji day trip',flag:'Scegli una sola delle alternative 3.1–3.4. L’ordine più lineare è Ropeway → lago → Oishi → Oshino.',original:['Tokyo → Kawaguchiko','Pagoda Chureito','Alternative Ropeway / lago / Oishi / Oshino','Kawaguchiko → Shinjuku','Shimokitazawa o Ginza','Appartamento'],auto:['Tokyo → Kawaguchiko','Pagoda Chureito','Mt. Fuji Panoramic Ropeway','Lago Kawaguchi + pranzo','Oishi Park','Oshino Hakkai + cena','Kawaguchiko → Shinjuku','Appartamento']}],Takayama:[{d:'23 ott',title:'Arrivo a Takayama',flag:'Percorso quasi interamente a piedi e logico.',original:['Tokyo → Nagoya','Nagoya → Takayama','Sanmachi Suji','Kusakabe e Yoshijima','Hida Kokubun-ji','Takayama Jinya','Cammino Higashiyama','Dekonaru Yokocho','Izakaya e pub','Hotel'],auto:['Tokyo → Nagoya','Nagoya → Takayama','Sanmachi Suji + pranzo','Kusakabe e Yoshijima','Hida Kokubun-ji','Takayama Jinya','Cammino Higashiyama','Dekonaru Yokocho','Izakaya e pub','Hotel']},{d:'24 ott',title:'Shirakawa-go',flag:'Conferma il bus di ritorno 17:11 prima di fermarti fino a tardi nel villaggio.',original:['Miyagawa Market','Bus per Shirakawa-go','Shirakawa-go','Bus per Takayama','Hotel','Onsen','Musica dal vivo','Ramen','Hotel'],auto:['Miyagawa Market','Bus per Shirakawa-go','Shirakawa-go','Bus per Takayama','Hotel + onsen','Musica dal vivo','Ramen','Hotel']}],Magome:[{d:'25 ott',title:'Magome - Tsumago',flag:'Ordine molto lineare. Prenota trasferimento bagagli e taxi per il ryokan.',original:['Bus verso Magome','Lasciare valigie','Magome-juku','Trekking 8 km','Tsumago-juku','Ritiro valige','Taxi al ryokan','Cena e relax'],auto:['Bus verso Magome','Lasciare valigie','Magome-juku + pranzo','Trekking 8 km','Tsumago-juku','Ritiro valige','Taxi al ryokan','Cena e relax']} ]};let city=location.search.match(/city=([^&]+)/)?decodeURIComponent(location.search.match(/city=([^&]+)/)[1]):'Tokyo';const key=d=>'j26-'+city+'-'+d.d;const el=s=>document.querySelector(s);function render(){el('#cities').innerHTML=Object.keys(plans).map(c=>`<button class="${c===city?'active':''}" onclick="location.search='?city='+encodeURIComponent('${c}')">${c}</button>`).join('');el('#days').innerHTML=plans[city].map((d,i)=>{let order=JSON.parse(localStorage.getItem(key(d))||'null')||d.auto;return `<section class="day" data-i="${i}"><h2>${d.d} · ${d.title}</h2><p class="sub">${city}</p><div class="flagged">⚑ ${d.flag}</div><div class="controls"><button onclick="reset(${i},'original')">Ordine originale</button><button class="primary" onclick="reset(${i},'auto')">Ordinamento automatico</button><button onclick="openMap(${i})">Apri percorso ↗</button></div><div class="route">${order.map((s,j)=>`<article class="stop" draggable="true" data-j="${j}"><span class="time">Tappa ${j+1}</span><div><h3>${s}</h3><p>Trascina per riordinare o usa le frecce.</p><textarea class="note" placeholder="Aggiungi una nota…" oninput="saveNote(${i},${j},this.value)">${localStorage.getItem(key(d)+'-note-'+s)||''}</textarea></div><div class="actions"><button onclick="move(${i},${j},-1)">↑</button><button onclick="move(${i},${j},1)">↓</button><button onclick="removeStop(${i},${j})">✕</button></div></article>`).join('')}</div></section>`}).join('');bindDrag()}function order(d){return JSON.parse(localStorage.getItem(key(d))||'null')||d.auto}function set(d,v){localStorage.setItem(key(d),JSON.stringify(v));render()}function reset(i,type){let d=plans[city][i];set(d,[...d[type]])}function move(i,j,n){let d=plans[city][i],a=order(d),k=j+n;if(k<0||k>=a.length)return;[a[j],a[k]]=[a[k],a[j]];set(d,a)}function removeStop(i,j){let d=plans[city][i],a=order(d);a.splice(j,1);set(d,a)}function saveNote(i,j,v){let d=plans[city][i],s=order(d)[j];localStorage.setItem(key(d)+'-note-'+s,v)}function openMap(i){let a=order(plans[city][i]);open('https://www.google.com/maps/dir/'+a.map(encodeURIComponent).join('/'),'_blank')}function bindDrag(){document.querySelectorAll('.route').forEach((r,i)=>{let from; r.querySelectorAll('.stop').forEach(s=>{s.ondragstart=()=>{from=+s.dataset.j;s.classList.add('drag')};s.ondragend=()=>s.classList.remove('drag');s.ondragover=e=>e.preventDefault();s.ondrop=e=>{e.preventDefault();let to=+s.dataset.j,d=plans[city][i],a=order(d),[x]=a.splice(from,1);a.splice(to,0,x);set(d,a)}})})}render();</script></html>
